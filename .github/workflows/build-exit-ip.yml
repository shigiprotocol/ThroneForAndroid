          +    /** The exit lookup after a URL test: a found IP / country is stored and shown; nothing is counted again. */
          +    fun reportExitLookup(results: List<ProbeResult>) {
          +        val found = results.filter { it.measured && it.error.isEmpty() && (it.ip.isNotEmpty() || it.country.isNotEmpty()) }
          +        for (result in results) {
          +            if (result.measured && result.error.isNotEmpty() && !ProxyEntity.isTestAborted(result.error)) {
          +                Logs.w("[${nameOf(result.profileId)}] exit IP lookup error: ${result.error}")
          +            }
          +        }
          +        persist(found) { ProfileManager.saveExitLookup(it.profileId, it.ip, it.country) }
          +        for (result in found) notifyClient { it.onIpResult(result.profileId, result.ip, result.country, "") }
          +    }
          +
               /**
                * The speed result loop of TestRunner.cpp:632-647 (the server's country name mapped to its code); the callback
