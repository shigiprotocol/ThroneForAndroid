          +import io.nekohasekai.sagernet.outbound.link.LinkBuilder
          +import io.nekohasekai.sagernet.outbound.link.LinkParser
          +import io.nekohasekai.sagernet.outbound.types.Custom
          +import io.nekohasekai.sagernet.outbound.types.Shadowsocks
          +import io.nekohasekai.sagernet.outbound.types.Trojan
          +import io.nekohasekai.sagernet.outbound.types.Vless
          +import io.nekohasekai.sagernet.outbound.types.Vmess
          +import io.nekohasekai.sagernet.validation.Issue
          +import io.nekohasekai.sagernet.validation.ParseDiag
          +import io.nekohasekai.sagernet.validation.Validation
          +
          +/**
          + * ShigiProtocol: with `xray_for_all` on, an imported VLESS, VMess, Trojan or Shadowsocks profile runs in the Xray core
          + * (as the Xray outbound an Xray JSON import would give: VLESS becomes an xrayvless profile, the others a custom Xray
          + * outbound). Every other protocol (Hysteria2, AnyTLS, TUIC, WireGuard, ...) has no Xray client and stays on sing-box.
          + *
          + * Only what Xray can carry the same way moves: a profile using a sing-box-only feature (an insecure or custom
          + * certificate, TLS fragment / tricks, sing-box multiplex, a transport Xray lacks such as h2 or QUIC, a legacy cipher,
          + * a SIP003 plugin, VMess alterId) stays on sing-box rather than connecting differently.
          + */
          +internal object XrayFirst {
          +
          +    /** The Shadowsocks methods Xray accepts (infra/conf/shadowsocks.go), mapped to the names it documents. */
          +    private val SS_METHODS = mapOf(
          +        "aes-128-gcm" to "aes-128-gcm",
          +        "aes-256-gcm" to "aes-256-gcm",
          +        "chacha20-poly1305" to "chacha20-poly1305",
          +        "chacha20-ietf-poly1305" to "chacha20-poly1305",
          +        "xchacha20-poly1305" to "xchacha20-poly1305",
          +        "xchacha20-ietf-poly1305" to "xchacha20-poly1305",
          +        "2022-blake3-aes-128-gcm" to "2022-blake3-aes-128-gcm",
          +        "2022-blake3-aes-256-gcm" to "2022-blake3-aes-256-gcm",
          +        "2022-blake3-chacha20-poly1305" to "2022-blake3-chacha20-poly1305",
          +        "none" to "none",
          +        "plain" to "none",
          +    )
          +
          +    /** The VMess ciphers Xray accepts (infra/conf/vmess.go). */
          +    private val VMESS_SECURITY = setOf("auto", "aes-128-gcm", "chacha20-poly1305", "none", "zero")
          +
          +    /**
          +     * The Xray profile for [outbound], or null when it stays as it is. [ctx] gives the global defaults (TLS fragment)
          +     * a profile may inherit. Only a profile that already passes its own sing-box checks is converted.
          +     */
          +    fun convert(outbound: Outbound, ctx: BuildContext): Outbound? {
          +        if (outbound !is Shadowsocks && outbound !is Vmess && outbound !is Trojan && outbound !is Vless) return null
          +        if (outbound.server.isBlank() || outbound.serverPort !in 1..65535) return null
          +        val checks = ArrayList<Issue>()
          +        try {
          +            outbound.validate(checks, ctx)
          +        } catch (e: RuntimeException) {
          +            return null
          +        }
          +        if (Validation.hasError(checks)) return null
          +        val json = try {
          +            when (outbound) {
          +                is Shadowsocks -> shadowsocks(outbound, ctx)
          +                is Vmess -> vmess(outbound, ctx)
          +                is Trojan -> trojan(outbound, ctx)
          +                is Vless -> vless(outbound, ctx)
          +                else -> null
          +            }
          +        } catch (e: RuntimeException) {
          +            null
          +        } ?: return null
          +        if (outbound.name.isNotEmpty()) json["tag"] = outbound.name
          +        val converted = Custom.fromXrayOutbound(json) ?: return null
          +        if (converted.name.isEmpty()) converted.name = outbound.name.ifEmpty { "${outbound.server}:${outbound.serverPort}" }
          +        // The importer's own Xray check ([CoreSupport]) must pass too, or the sing-box profile is kept.
          +        if (CoreSupport.problem(converted) != null) return null
          +        return converted
          +    }
          +
          +    private fun shadowsocks(ss: Shadowsocks, ctx: BuildContext): JsonObject? {
          +        if (ss.plugin.isNotBlank() || ss.multiplex.effectivelyOn(ctx)) return null
          +        val method = SS_METHODS[ss.method.trim().lowercase()] ?: return null
          +        val server = peer(ss)
          +        server["method"] = method
          +        server["password"] = ss.password
          +        if (ss.uot) {
          +            // sing-box's udp_over_tcp defaults to version 2, which Xray must be told explicitly.
          +            server["uot"] = true
          +            server["UoTVersion"] = 2
          +        }
          +        return outbound("shadowsocks", "servers", server, null)
          +    }
          +
          +    private fun vmess(vm: Vmess, ctx: BuildContext): JsonObject? {
          +        if (vm.multiplex.effectivelyOn(ctx) || vm.alter_id != 0 || vm.authenticated_length || vm.global_padding) return null
          +        val security = vm.security.trim().lowercase().ifEmpty { "auto" }
          +        if (security !in VMESS_SECURITY) return null
          +        val stream = stream(vm.transport, vm.tls, ctx) ?: return null
          +        val user = JsonObject()
          +        user["id"] = vm.uuid
          +        user["security"] = security
          +        return outbound("vmess", "vnext", peer(vm).also { it["users"] = JsonArray().add(user) }, stream)
          +    }
          +
          +    private fun trojan(tr: Trojan, ctx: BuildContext): JsonObject? {
          +        if (tr.multiplex.effectivelyOn(ctx)) return null
          +        val stream = stream(tr.transport, tr.tls, ctx) ?: return null
          +        val server = peer(tr)
          +        server["password"] = tr.password
          +        return outbound("trojan", "servers", server, stream)
          +    }
          +
          +    private fun vless(vl: Vless, ctx: BuildContext): JsonObject? {
          +        if (vl.multiplex.effectivelyOn(ctx)) return null
          +        val flow = vl.flow.trim().lowercase()
          +        if (flow.isNotEmpty() && flow != "none" && flow != "xtls-rprx-vision") return null
          +        val stream = stream(vl.transport, vl.tls, ctx) ?: return null
          +        val user = JsonObject()
          +        user["id"] = vl.uuid
          +        user["encryption"] = "none"
          +        if (flow == "xtls-rprx-vision") user["flow"] = flow
          +        return outbound("vless", "vnext", peer(vl).also { it["users"] = JsonArray().add(user) }, stream)
          +    }
          +
          +    /**
          +     * The Xray streamSettings of a sing-box transport and TLS: both go out as share-link query items, which the Xray
          +     * stream reads back exactly as for an imported link. Null for what Xray cannot carry the same way.
          +     */
          +    private fun stream(transport: Transport, tls: Tls, ctx: BuildContext): JsonObject? {
          +        if (tls.enabled) {
          +            if (tls.insecure || ctx.skipCert || tls.disable_sni) return null
          +            if (tls.certificate.isNotEmpty() || tls.certificate_path.isNotEmpty() ||
          +                tls.certificate_public_key_sha256.isNotEmpty() ||
          +                tls.client_certificate.isNotEmpty() || tls.client_certificate_path.isNotEmpty() ||
          +                tls.client_key.isNotEmpty() || tls.client_key_path.isNotEmpty()
          +            ) return null
          +            if (tls.fragmentEffectivelyOn(ctx) || tls.record_fragment || tls.tls_tricks) return null
          +            if (tls.min_version.isNotEmpty() || tls.max_version.isNotEmpty() || tls.curve_preferences.isNotEmpty()) return null
          +            if (tls.ech.enabled) return null
          +        }
          +        val type = transport.type.trim().lowercase()
          +        if (type.isNotEmpty() && type != "tcp" && type != "ws" && type != "grpc" && type != "httpupgrade" &&
          +            !(type == "http" && !tls.enabled)
          +        ) return null
          +        if (transport.method.isNotEmpty() || transport.headers.isNotEmpty()) return null
          +
          +        val query = ArrayList<Pair<String, String>>()
          +        query.addAll(transport.exportToLink(tls.enabled))
          +        if (type == "ws" && transport.max_early_data > 0 && !transport.path.contains("?ed=")) {
          +            query.add("ed" to transport.max_early_data.toString())
          +        }
          +        if (tls.enabled) query.addAll(tls.exportToLink()) else query.add("security" to "none")
          +        val link = LinkBuilder("vless").setUserName("x")
          +        link.host = "example.com"
          +        link.port = 443
          +        link.addQueryItems(query)
          +
          +        val stream = XrayStreamSetting()
          +        val issues = ArrayList<Issue>()
          +        val parsed = ParseDiag.scoped(issues) { stream.parseFromLink(LinkParser.parse(link.build())) }
          +        if (!parsed || Validation.hasError(issues) || stream.network !in xrayNetworks) return null
          +        val expected = if (!tls.enabled) "none" else if (tls.reality.enabled) "reality" else "tls"
          +        if (stream.security != expected) return null
          +        return stream.exportToJson()
          +    }
          +
          +    private fun peer(outbound: Outbound): JsonObject {
          +        val server = JsonObject()
          +        server["address"] = outbound.server
          +        server["port"] = outbound.serverPort
          +        return server
          +    }
          +
          +    private fun outbound(protocol: String, list: String, peer: JsonObject, stream: JsonObject?): JsonObject {
          +        val settings = JsonObject()
          +        settings[list] = JsonArray().add(peer)
          +        val out = JsonObject()
          +        out["protocol"] = protocol
          +        out["settings"] = settings
          +        if (stream != null) out["streamSettings"] = stream
          +        return out
          +    }
          +}
