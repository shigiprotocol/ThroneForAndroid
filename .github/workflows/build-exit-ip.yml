name: Build Throne with exit IP
# Paste this one file into your fork as .github/workflows/build-exit-ip.yml, then Actions > this workflow > Run workflow.
# It applies the "exit IP after ping" change, builds with a throwaway signing key (no secrets needed) and uploads the
# APKs. Package name gets ".ip" so it installs next to the official app; the in-app updater is off (F-Droid flavor).
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Apply the exit-IP change
        run: |
          cat > "$RUNNER_TEMP/exit-ip.patch" <<'PATCH_EOF'
          diff --git a/app/src/main/java/io/nekohasekai/sagernet/bg/test/IpTestRunner.kt b/app/src/main/java/io/nekohasekai/sagernet/bg/test/IpTestRunner.kt
          index 42ee125..645cd32 100644
