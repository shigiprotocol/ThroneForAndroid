               }
           
          +    /**
          +     * The exit lookup that follows a URL test: fills in the egress IP and country, never touching the latency or
          +     * error the URL test stored; a failed lookup leaves the profile as it is.
          +     */
          +    fun applyExitLookup(ip: String, country: String) {
          +        if (ip.isNotEmpty()) ipOut = ip
          +        if (country.isNotEmpty()) testCountry = country
          +    }
          +
               /** TestRunner::applyIpResult (TestRunner.cpp:144-157): an error clears the egress IP and country. */
               fun applyIpResult(ip: String, country: String, error: String) {
                   if (error.isEmpty()) {
          diff --git a/app/src/main/java/io/nekohasekai/sagernet/database/SettingsRegistry.kt b/app/src/main/java/io/nekohasekai/sagernet/database/SettingsRegistry.kt
          index 8d44ff2..5710cb3 100644
          --- a/app/src/main/java/io/nekohasekai/sagernet/database/SettingsRegistry.kt
          +++ b/app/src/main/java/io/nekohasekai/sagernet/database/SettingsRegistry.kt
          @@ -251,6 +251,8 @@ object SettingsRegistry {
               @JvmField val URL_TEST_TIMEOUT_MS = int("url_test_timeout_ms", 3000) { it > 0 }
               @JvmField val TEST_CONCURRENT = int("test_concurrent", 10) { it > 0 }
               @JvmField val DIRECT_TEST_URL = string("direct_test_url", "")
          +    /** After a URL test (or a country-mode speed test), look up the exit IP and country of every working profile. */
          +    @JvmField val TEST_LOOKUP_EXIT_IP = bool("test_lookup_exit_ip", true)
               /** The exit country of the running connection (widget/ExitIp.kt); off never asks a lookup service on its own. */
               @JvmField val EXIT_COUNTRY_LOOKUP = bool("exit_country_lookup", true)
               /** "auto" or one service id of ExitIp; an id this build does not know (a newer desktop's) runs as "auto". */
          diff --git a/app/src/main/java/io/nekohasekai/sagernet/ui/profiles/ProfileListAdapter.kt b/app/src/main/java/io/nekohasekai/sagernet/ui/profiles/ProfileListAdapter.kt
          index 97828f0..5e2ffac 100644
          --- a/app/src/main/java/io/nekohasekai/sagernet/ui/profiles/ProfileListAdapter.kt
          +++ b/app/src/main/java/io/nekohasekai/sagernet/ui/profiles/ProfileListAdapter.kt
          @@ -257,14 +257,23 @@ internal class ProfileListAdapter(private val fragment: ProfileListFragment) :
           
               /** Queued / testing rows of a running session; results arrive through the database. */
               fun onTestState(state: TestUiState) {
