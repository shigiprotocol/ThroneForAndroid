          +        <SwitchPreference
          +            app:icon="@drawable/baseline_public_24"
          +            app:key="test_lookup_exit_ip"
          +            app:summary="@string/test_lookup_exit_ip_sum"
          +            app:title="@string/test_lookup_exit_ip" />
               </PreferenceCategory>
           
               <PreferenceCategory app:title="@string/cag_exit_country">
          
          PATCH_EOF
          git apply --whitespace=nowarn "$RUNNER_TEMP/exit-ip.patch"
