              'mipmap-anydpi/ic_launcher.xml': '<?xml version="1.0" encoding="utf-8"?>\n<!-- Android 7.x (no adaptive icons): the same art on a round badge. -->\n<layer-list xmlns:android="http://schemas.android.com/apk/res/android">\n    <item>\n        <shape android:shape="oval">\n            <solid android:color="#FF15297A" />\n        </shape>\n    </item>\n    <item android:drawable="@drawable/ic_shigi_foreground" />\n</layer-list>\n',
          }
          for name, text in ICONS.items():
              os.makedirs(os.path.dirname(R + "/" + name), exist_ok=True)
              open(R + "/" + name, "w").write(text)
          print("rebranded to ShigiProtocol")
          PY_EOF
          python3 "$RUNNER_TEMP/rebrand.py"
          git diff --stat | tail -1
      - name: Package name and signing key
        run: |
          set -euo pipefail
          sed -i 's/^PACKAGE_NAME=.*/PACKAGE_NAME=com.shigiprotocol.app/' nb4a.properties
          # Also a universal APK (every ABI in one file) next to the per-ABI ones.
          sed -i 's/isUniversalApk = false/isUniversalApk = true/' buildSrc/src/main/kotlin/Helpers.kt
          grep -q 'isUniversalApk = true' buildSrc/src/main/kotlin/Helpers.kt
          # Every vless:// link (3x-ui) runs in the Xray core by default; still changeable under Settings > Core > Xray.
          sed -i 's/XRAY_VLESS_PREFERENCE = int("xray_vless_preference", 1)/XRAY_VLESS_PREFERENCE = int("xray_vless_preference", 2)/' app/src/main/java/io/nekohasekai/sagernet/database/SettingsRegistry.kt
          grep -q 'int("xray_vless_preference", 2)' app/src/main/java/io/nekohasekai/sagernet/database/SettingsRegistry.kt
          sed -i 's/DEFAULT_XRAY_VLESS_PREFERENCE: XrayVlessPreference = XrayVlessPreference.XhttpAndReality/DEFAULT_XRAY_VLESS_PREFERENCE: XrayVlessPreference = XrayVlessPreference.AllVLESS/' app/src/main/java/io/nekohasekai/sagernet/outbound/OutboundFactory.kt
          grep -q 'DEFAULT_XRAY_VLESS_PREFERENCE: XrayVlessPreference = XrayVlessPreference.AllVLESS' app/src/main/java/io/nekohasekai/sagernet/outbound/OutboundFactory.kt
          # Persian: the Logs screen is "reports", not "stats and info".
          sed -i 's|<string name="menu_log">آمار و اطلاعات</string>|<string name="menu_log">گزارش‌ها</string>|' app/src/main/res/values-fa/strings.xml
          {
            echo "SIGNING_KEYSTORE_"
            echo "SIGNING_STORE_PASSWORD=shigiprotocol"
            echo "SIGNING_KEY_ALIAS=shigi"
            echo "SIGNING_KEY_PASSWORD=shigiprotocol"
          } >> "$GITHUB_ENV"
      - name: Build
        uses: ./.github/actions/android-build
        with:
          tasks: app:assembleFdroidRelease
          channel: stable
          build-number: '999'
          sign: 'true'
      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: ShigiProtocol
          path: app/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: error
          retention-days: 14
