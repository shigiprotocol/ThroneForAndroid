                       }
           
                       TestSpec.KIND_IP -> IpTestRunner(this).run(profiles)
          -            TestSpec.KIND_SPEED -> SpeedTestRunner(this).run(profiles)
          +            TestSpec.KIND_SPEED -> {
          +                SpeedTestRunner(this).run(profiles)
          +                if (options.speedMode == SpeedTestSettings.COUNTRY) lookupExitIps(profiles)
