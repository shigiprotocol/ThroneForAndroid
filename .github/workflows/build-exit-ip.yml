          @@ -23,7 +26,8 @@ internal class IpTestRunner(session: TestSession) : LatencySweep(session) {
                   })
               }
           
          -    override fun report(results: List<ProbeResult>) = session.reportIp(results)
          +    override fun report(results: List<ProbeResult>) =
          +        if (exitLookup) session.reportExitLookup(results) else session.reportIp(results)
           
               /** Not tested: the desktop only flags the latency in memory for an invalid candidate. */
               override fun invalid(profileId: Long, reason: String) = ProbeResult(profileId, error = reason, measured = false)
          diff --git a/app/src/main/java/io/nekohasekai/sagernet/bg/test/TestSession.kt b/app/src/main/java/io/nekohasekai/sagernet/bg/test/TestSession.kt
