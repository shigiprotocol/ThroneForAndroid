      - name: Package name and throwaway signing key
        run: |
          set -euo pipefail
          sed -i 's/^PACKAGE_NAME=\(.*\)$/PACKAGE_NAME=\1.ip/' nb4a.properties
          grep '^PACKAGE_NAME=' nb4a.properties
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/fork.jks" -storetype PKCS12 -storepass "$PASS" \
            -keypass "$PASS" -alias fork -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Throne fork"
          {
            echo "SIGNING_KEYSTORE_B64=$(base64 -w0 "$RUNNER_TEMP/fork.jks")"
            echo "SIGNING_STORE_PASSWORD=$PASS"
            echo "SIGNING_KEY_ALIAS=fork"
            echo "SIGNING_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"
      - name: Build
        uses: ./.github/actions/android-build
