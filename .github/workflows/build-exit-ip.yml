          +++ b/app/src/main/java/io/nekohasekai/sagernet/database/ProxyEntity.kt
          @@ -169,10 +169,22 @@ data class ProxyEntity(
                       else -> {
                           recordLatency(-1)
                           testError = error
          +                // A dead server keeps no stale flag / exit IP from an earlier test.
          +                testCountry = null
          +                ipOut = null
                       }
