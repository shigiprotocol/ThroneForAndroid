          tasks: app:assembleFdroidRelease
          channel: stable
          build-number: '999'
          sign: 'true'
      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: Throne-exit-ip
          path: app/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: error
          retention-days: 14
