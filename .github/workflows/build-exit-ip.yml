          for name, text in ICONS.items():
              os.makedirs(os.path.dirname(R + "/" + name), exist_ok=True)
              open(R + "/" + name, "w").write(text)
          print("rebranded to ShigiProtocol")
          PY_EOF
          python3 "$RUNNER_TEMP/rebrand.py"
          git diff --stat | tail -1
      - name: Package name and signing key
        run: |
          set -euo pipefail
          sed -i 's/^PACKAGE_NAME=.*/PACKAGE_NAME=com.shigiprotocol.app/' nb4a.properties
          # Also a universal APK (every ABI in one file) next to the per-ABI ones.
          sed -i 's/isUniversalApk = false/isUniversalApk = true/' buildSrc/src/main/kotlin/Helpers.kt
          grep -q 'isUniversalApk = true' buildSrc/src/main/kotlin/Helpers.kt
          # Persian: the Logs screen is "reports", not "stats and info".
          sed -i 's|<string name="menu_log">آمار و اطلاعات</string>|<string name="menu_log">گزارش‌ها</string>|' app/src/main/res/values-fa/strings.xml
          {
            echo "SIGNING_KEYSTORE_"
            echo "SIGNING_STORE_PASSWORD=shigiprotocol"
            echo "SIGNING_KEY_ALIAS=shigi"
            echo "SIGNING_KEY_PASSWORD=shigiprotocol"
          } >> "$GITHUB_ENV"
      - name: Build
        uses: ./.github/actions/android-build
        with:
          tasks: app:assembleFdroidRelease
          channel: stable
          build-number: '999'
          sign: 'true'
      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: ShigiProtocol
          path: app/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: error
          retention-days: 14
