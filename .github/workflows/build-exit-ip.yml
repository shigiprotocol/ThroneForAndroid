name: Build ShigiProtocol
# Paste this one file into your fork as .github/workflows/build-exit-ip.yml, then Actions > Build ShigiProtocol >
# Run workflow. It applies the "exit IP after ping" change and the ShigiProtocol name / icon, builds a signed APK
# (F-Droid flavor: the in-app updater stays off) and uploads it. The signing key below is fixed, so later builds
# install over earlier ones; it lives in this file, so install only APKs you built yourself.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Exit IP after the ping test
        run: |
          cat > "$RUNNER_TEMP/exit-ip.patch" <<'PATCH_EOF'
