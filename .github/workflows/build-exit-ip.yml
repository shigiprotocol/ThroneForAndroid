          +++ b/app/src/main/res/values-fa/strings.xml
          @@ -2384,4 +2384,6 @@
               <string name="validation_route_dns_dropped">تنظیمات DNS اختصاصی پروفایل کنار گذاشته شد، بنابراین از تنظیمات سراسری استفاده می‌کند: %1$s</string>
               <string name="route_dns_global_servers">ریموت %1$s، مستقیم %2$s</string>
               <string name="dns_server_suggestions">سرورهای اخیر و پیشنهادی</string>
          +    <string name="test_lookup_exit_ip">نمایش IP خروجی بعد از تست پینگ</string>
          +    <string name="test_lookup_exit_ip_sum">بعد از تست URL (یا تست سرعت در حالت کشور)، از طریق هر پروفایل سالم IP و کشور خروجی را از یک سرویس IP می‌پرسد و کنار پینگ نشان می‌دهد.</string>
           </resources>
          diff --git a/app/src/main/res/values/strings.xml b/app/src/main/res/values/strings.xml
          index f9bd29e..908f142 100644
          --- a/app/src/main/res/values/strings.xml
          +++ b/app/src/main/res/values/strings.xml
          @@ -2581,4 +2581,6 @@
               <string name="validation_route_dns_dropped">The profile\'s own DNS settings were dropped, so it uses the global ones: %1$s</string>
               <string name="route_dns_global_servers">Remote %1$s, direct %2$s</string>
               <string name="dns_server_suggestions">Recent and suggested servers</string>
          +    <string name="test_lookup_exit_ip">Show exit IP after URL test</string>
          +    <string name="test_lookup_exit_ip_sum">After a URL test (or a country-mode speed test), ask an IP lookup service through each working profile for its exit IP and country, and show them next to the latency.</string>
