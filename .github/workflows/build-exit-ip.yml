          +        if (kind != TestSpec.KIND_IP) {
          +            // The exit lookup after a latency test: the row keeps its result and counts, gaining the IP / country.
          +            val id = resolve(profileId)
          +            val row = rows[id] ?: return
          +            if (row.phase != RowPhase.DONE) return
          +            rows[id] = row.copy(ip = ip.ifEmpty { row.ip }, country = country.ifEmpty { row.country })
          +            rowsDirty = true
          +            if (country.isNotEmpty()) working[id]?.let {
          +                working[id] = it.copy(country = country)
          +                rankingDirty = true
